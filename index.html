<style>
/* Layout: sticky bar, hero with glowing ring logo, skin viewer (stage + picker), rules/prices side by side, footer. Single dark look taken from the logo. */
:root {
  --bg: #060203;
  --panel: #140607;
  --panel-2: #1c090b;
  --line: #3b1013;
  --red: #ff2a14;
  --hot: #ff7a5c;
  --deep: #b80000;
  --fg: #fff1ee;
  --mute: #b98d88;
  --ok: #3ddc84;
  --f-display: "Unbounded", "Arial Black", sans-serif;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-pixel: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  overflow-x: hidden;
}
a { color: inherit; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.05; }
:focus-visible { outline: 2px solid var(--hot); outline-offset: 3px; }

.wrap { max-width: 1120px; margin: 0 auto; }

/* ---------- top bar ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: rgba(6, 2, 3, .86);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 10px max(16px, env(safe-area-inset-left, 0px));
}
.bar-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }

    var sv = $("statusV");
    sv.textContent = ORDERS_OPEN ? t.status_open : t.status_closed;
    sv.className = "v " + (ORDERS_OPEN ? "open" : "shut");
    document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });
    document.title = "ESIRAK Skins";
    $("payV").textContent = t.pay_v.replace("{fee}", BOOSTY_FEE);
    renderPrices();
  }

  function priceRow(it) {
    var li = document.createElement("li");
    var n = document.createElement("span"); n.className = "n";
    n.appendChild(document.createTextNode(it[lang]));
    var note = lang === "ru" ? it.noteRu : it.noteEn;
    if (note) { var no = document.createElement("span"); no.className = "note"; no.textContent = note; n.appendChild(no); }
    var p = document.createElement("span"); p.className = "p";
    p.appendChild(document.createTextNode(it.price + " "));
    var sm = document.createElement("small"); sm.textContent = "₽"; p.appendChild(sm);
    li.appendChild(n); li.appendChild(p);
    return li;
  }
  function renderPrices() {
    [["priceMain", PRICES.main], ["priceExtra", PRICES.extra]].forEach(function (g) {
      var ul = $(g[0]); ul.innerHTML = "";
      g[1].forEach(function (it) { ul.appendChild(priceRow(it)); });
    });
  }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function renderSkin(animate) {
    var img = $("skinImg");
    if (!SKINS.length) { img.removeAttribute("src"); img.alt = ""; $("count").textContent = ""; return; }
    var src = SKINS[cur];
    function fill() {
      img.src = src;
      img.alt = "Skin " + (cur + 1);
      $("count").textContent = pad(cur + 1) + " / " + pad(SKINS.length);
      img.classList.remove("swap");
    }
    if (animate) { img.classList.add("swap"); setTimeout(fill, 180); } else { fill(); }
    document.querySelectorAll(".thumb").forEach(function (b, i) { b.setAttribute("aria-current", String(i === cur)); });
  }

  function renderThumbs() {
    var box = $("thumbs");
    box.innerHTML = "";
    SKINS.forEach(function (src, i) {
      var b = document.createElement("button");
      b.className = "thumb"; b.type = "button"; b.setAttribute("role", "listitem");
      b.setAttribute("aria-label", "Skin " + (i + 1));
      var im = document.createElement("img"); im.src = src; im.alt = ""; im.loading = "lazy";
      b.appendChild(im);
      b.addEventListener("click", function () { go(i); });
      box.appendChild(b);
    });
    var multi = SKINS.length > 1;
    $("prevBtn").hidden = !multi; $("nextBtn").hidden = !multi;
    box.hidden = !multi;
  }

  function go(i) {
    if (!SKINS.length) return;
    cur = (i + SKINS.length) % SKINS.length;
    renderSkin(true);
  }

  $("prevBtn").addEventListener("click", function () { go(cur - 1); });
  $("nextBtn").addEventListener("click", function () { go(cur + 1); });
  document.addEventListener("keydown", function (e) {
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowLeft") go(cur - 1);
    if (e.key === "ArrowRight") go(cur + 1);
  });

  // swipe
  var sx = null;
  var stage = $("stage");
  stage.addEventListener("pointerdown", function (e) { sx = e.clientX; });
  stage.addEventListener("pointerup", function (e) {
    if (sx === null) return;
    var dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1));
  });
  stage.addEventListener("pointercancel", function () { sx = null; });

  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () {
      lang = b.dataset.lang;
      try { localStorage.setItem("esirak-lang", lang); } catch (e) {}
      applyStatic(); renderThumbs(); renderSkin(false);
    });
  });

  applyStatic(); renderThumbs(); renderSkin(false);
})();
</script>
</body>
</html>
