<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESIRAK Skins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700;900&family=Onest:wght@400;500;700&display=swap">
<style>
/* Layout: sticky bar, hero with glowing ring logo, skin viewer (stage + picker), rules/prices side by side, footer. Single dark look taken from the logo. */
:root {
  --bg: #060203;
  --panel: #140607;
  --panel-2: #1c090b;
  --line: #3b1013;
  --red: #ff2a14;
  --hot: #ff7a5c;
  --deep: #b80000;
  --fg: #fff1ee;
  --mute: #b98d88;
  --ok: #3ddc84;
  --f-display: "Unbounded", "Arial Black", sans-serif;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-pixel: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--f-body);
  font-size: 16px;
  line-height: 1.55;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
  overflow-x: hidden;
}
a { color: inherit; }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.05; }
:focus-visible { outline: 2px solid var(--hot); outline-offset: 3px; }

.wrap { max-width: 1120px; margin: 0 auto; }

/* ---------- top bar ---------- */
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.bar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: rgba(6, 2, 3, .86);
  backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 10px max(16px, env(safe-area-inset-left, 0px));
}
.bar-in { max-width: 1120px; margin: 0 auto; display: flex; align-items: center; gap: 14px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; min-width: 0; }
.brand img { width: 56px; height: 44px; object-fit: contain; mix-blend-mode: screen; flex: none; }
.brand b { font-family: var(--f-display); font-weight: 900; letter-spacing: .04em; font-size: 15px; }
.nav { display: flex; gap: 20px; }
.nav a { text-decoration: none; color: var(--mute); font-weight: 500; font-size: 14px; transition: color .15s; }
.nav a:hover { color: var(--fg); }
.lang { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); }
.lang button {
  font: 700 12px var(--f-pixel); letter-spacing: .1em; color: var(--mute);
  background: none; border: 0; border-radius: 999px; padding: 6px 12px; cursor: pointer;
}
.lang button[aria-pressed="true"] { background: var(--red); color: #fff; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  font: 700 14px var(--f-display); letter-spacing: .02em; text-decoration: none;
  color: #fff; background: linear-gradient(180deg, #ff4a30, var(--red) 55%, #d81400);
  border: 0; border-radius: 14px; padding: 14px 24px; cursor: pointer;
  box-shadow: 0 0 0 1px rgba(255,160,140,.55) inset, 0 8px 30px rgba(255,42,20,.38);
  transition: transform .15s, box-shadow .15s;
}
.btn:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px rgba(255,190,170,.8) inset, 0 12px 40px rgba(255,42,20,.55); }
.btn.sm { padding: 10px 16px; font-size: 12px; border-radius: 11px; }
.btn.lg { padding: 18px 34px; font-size: 16px; border-radius: 16px; }
.btn svg { width: 18px; height: 18px; flex: none; }

/* ---------- hero ---------- */
.hero { display: grid; grid-template-columns: 1.05fr 1fr; align-items: center; gap: 24px; padding-block: 48px 36px; }
.hero > * { min-width: 0; }
.pill {
  display: inline-flex; align-items: center; gap: 10px;
  font: 700 13px var(--f-pixel); letter-spacing: .12em; text-transform: uppercase;
  padding: 8px 14px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel);
}
.dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 0 0 rgba(61,220,132,.7); animation: ping 1.8s infinite; }
.closed .dot { background: var(--red); animation: none; }
@keyframes ping { 70% { box-shadow: 0 0 0 9px rgba(61,220,132,0); } 100% { box-shadow: 0 0 0 0 rgba(61,220,132,0); } }
.hero h1 { font-size: clamp(34px, 5.6vw, 66px); font-weight: 900; margin: 22px 0 16px; letter-spacing: -.01em; }
.hero h1 em { font-style: normal; color: var(--red); text-shadow: 0 0 28px rgba(255,42,20,.65); }
.hero p { color: var(--mute); max-width: 46ch; margin: 0 0 28px; font-size: 17px; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn.ghost { background: transparent; box-shadow: 0 0 0 1px var(--line) inset; color: var(--fg); }
.btn.ghost:hover { box-shadow: 0 0 0 1px var(--hot) inset; }
.hero-logo { position: relative; display: grid; place-items: center; }
.hero-logo::after { content: ""; position: absolute; inset: 10% 5%; background: radial-gradient(closest-side, rgba(255,42,20,.35), transparent 70%); filter: blur(30px); z-index: 0; }
.hero-logo img { position: relative; z-index: 1; width: 100%; max-width: 560px; height: auto; mix-blend-mode: screen; animation: float 7s ease-in-out infinite; }
@keyframes float { 50% { transform: translateY(-10px) rotate(-1.2deg); } }

/* ---------- ticker ---------- */
.ticker { margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); background: var(--red); color: #1a0000; overflow: hidden; transform: rotate(-1deg); border-block: 2px solid #1a0000; }
.ticker div { display: flex; width: max-content; animation: tick 28s linear infinite; }
.ticker span { font: 700 16px var(--f-pixel); letter-spacing: .14em; padding: 9px 22px; white-space: nowrap; text-transform: uppercase; }
@keyframes tick { to { transform: translateX(-50%); } }

/* ---------- sections ---------- */
section { padding-block: 64px 8px; scroll-margin-top: 70px; }
.sec-h { display: flex; align-items: end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 26px; }
.sec-h h2 { font-size: clamp(26px, 4vw, 42px); font-weight: 900; }
.sec-h h2 i { font-style: normal; color: var(--red); }
.sec-h small { font: 500 13px var(--f-pixel); color: var(--mute); letter-spacing: .1em; text-transform: uppercase; }

/* ---------- skin viewer ---------- */
.viewer { display: grid; grid-template-columns: 1.25fr 1fr; gap: 20px; }
.viewer > * { min-width: 0; }
.stage {
  position: relative; min-height: 460px; border-radius: 26px; border: 1px solid var(--line); overflow: hidden;
  background:
    radial-gradient(70% 60% at 50% 55%, rgba(255,42,20,.30), transparent 70%),
    linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px) 0 0 / 24px 24px,
    var(--panel);
  display: grid; place-items: center; padding: 28px 64px; touch-action: pan-y; user-select: none;
}
.stage img { max-width: 100%; max-height: 400px; width: auto; height: auto; image-rendering: pixelated; filter: drop-shadow(0 18px 28px rgba(255,42,20,.35)); transition: opacity .25s, transform .25s; }
.stage img.swap { opacity: 0; transform: scale(.96); }
.arrow {
  position: absolute; top: 50%; translate: 0 -50%; width: 46px; height: 46px; border-radius: 14px;
  background: rgba(6,2,3,.7); border: 1px solid var(--line); color: var(--fg); cursor: pointer; display: grid; place-items: center;
  transition: border-color .15s, background .15s;
}
.arrow:hover { border-color: var(--hot); background: var(--deep); }
.arrow svg { width: 20px; height: 20px; }
.arrow.prev { left: 12px; }
.arrow.next { right: 12px; }
.count { position: absolute; left: 18px; bottom: 14px; font: 700 14px var(--f-pixel); letter-spacing: .12em; color: var(--mute); }
.info { display: flex; flex-direction: column; gap: 18px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 22px; padding: 24px; }
.info .card h3 { font-size: clamp(22px, 3vw, 30px); font-weight: 900; margin-bottom: 16px; }
.tags { display: flex; flex-wrap: wrap; gap: 8px; }
.tag { font: 700 12px var(--f-pixel); letter-spacing: .1em; text-transform: uppercase; padding: 6px 11px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel-2); color: var(--hot); }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 10px; }
.thumb { aspect-ratio: 1; border-radius: 14px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; padding: 6px; display: grid; place-items: center; transition: border-color .15s, transform .15s; }
.thumb:hover { transform: translateY(-2px); border-color: var(--hot); }
.thumb[aria-current="true"] { border-color: var(--red); box-shadow: 0 0 0 1px var(--red), 0 0 22px rgba(255,42,20,.4); }
.thumb img { width: 100%; height: 100%; object-fit: contain; image-rendering: pixelated; }
.empty-note { color: var(--mute); font-size: 13px; }

/* ---------- order block ---------- */
.order { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; align-items: start; }
.order > * { min-width: 0; }
.col { display: flex; flex-direction: column; gap: 20px; }
.card h3 { font-size: 18px; font-weight: 700; margin-bottom: 18px; letter-spacing: .02em; text-transform: uppercase; }
.rules ol { list-style: none; counter-reset: r; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 14px; }
.rules li { counter-increment: r; display: grid; grid-template-columns: 38px 1fr; gap: 14px; align-items: start; }
.rules li::before { content: counter(r); font: 800 18px var(--f-display); width: 38px; height: 38px; display: grid; place-items: center; border-radius: 10px; background: var(--red); color: #fff; }
.rules li span { padding-top: 6px; }
.rules b { color: var(--hot); }
.prices { list-style: none; margin: 0; padding: 0; }
.prices li { display: flex; align-items: baseline; gap: 12px; padding: 14px 0; border-bottom: 1px dashed var(--line); }
.prices li:last-child { border-bottom: 0; }
.prices .n { flex: 1; min-width: 0; }
.prices .p { font: 900 22px var(--f-display); color: var(--fg); white-space: nowrap; font-variant-numeric: tabular-nums; }
.prices .p small { color: var(--red); font-size: 16px; }
.prices .note { display: block; color: var(--mute); font-size: 13px; margin-top: 4px; }
.status { display: flex; flex-direction: column; gap: 14px; }
.status .row { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: center; }
.status .k { font: 700 12px var(--f-pixel); letter-spacing: .12em; color: var(--mute); text-transform: uppercase; }
.status .v { font-weight: 700; }
.status .v.open { color: var(--ok); }
.status .v.shut { color: var(--red); }
.status .btn { width: 100%; margin-top: 6px; }

/* ---------- footer ---------- */
footer { margin-top: 72px; padding-block: 28px 40px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; gap: 14px; flex-wrap: wrap; color: var(--mute); font-size: 14px; }
footer a { color: var(--hot); text-decoration: none; }
footer a:hover { text-decoration: underline; }

/* ---------- responsive ---------- */
@media (max-width: 860px) {
  .nav { display: none; }
  .hero { grid-template-columns: 1fr; padding-block: 28px 24px; }
  .hero-logo { order: -1; }
  .hero-logo img { max-width: 420px; }
  .viewer, .order { grid-template-columns: 1fr; }
  .stage { min-height: 400px; padding: 24px 56px; }
}
@media (max-width: 520px) {
  .brand b { display: none; }
  .btn.sm { padding: 10px 12px; }
  .stage { padding: 20px 48px; min-height: 360px; }
  .stage img { max-height: 320px; }
  .arrow { width: 40px; height: 40px; }
  .prices .p { font-size: 18px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
  html { scroll-behavior: auto; }
}
</style>

</head>

    document.querySelectorAll("[data-i18n-html]").forEach(function (el) { el.innerHTML = t[el.dataset.i18nHtml]; });
    $("heroStatusText").textContent = ORDERS_OPEN ? t.open : t.closed;
    $("heroStatus").classList.toggle("closed", !ORDERS_OPEN);
    var sv = $("statusV");
    sv.textContent = ORDERS_OPEN ? t.status_open : t.status_closed;
    sv.className = "v " + (ORDERS_OPEN ? "open" : "shut");
    document.querySelectorAll(".lang button").forEach(function (b) { b.setAttribute("aria-pressed", String(b.dataset.lang === lang)); });
    document.title = "ESIRAK Skins";
  }

  function pad(n) { return n < 10 ? "0" + n : "" + n; }

  function renderSkin(animate) {
    var t = T[lang];
    var img = $("skinImg");
    if (!SKINS.length) {
      img.removeAttribute("src"); img.alt = "";
      $("skinName").textContent = t.empty; $("skinTags").innerHTML = ""; $("count").textContent = "";
      return;
    }
    var s = SKINS[cur];
    function fill() {
      img.src = s.img;
      img.alt = s.name[lang];
      $("skinName").textContent = s.name[lang];
      var tags = [];
      if (s.arms) tags.push(t.arms + ": " + s.arms);
      $("skinTags").innerHTML = tags.map(function (x) { return '<span class="tag"></span>'; }).join("");
      $("skinTags").querySelectorAll(".tag").forEach(function (el, i) { el.textContent = tags[i]; });
      $("count").textContent = pad(cur + 1) + " / " + pad(SKINS.length);
      img.classList.remove("swap");
    }
    if (animate) { img.classList.add("swap"); setTimeout(fill, 180); } else { fill(); }
    document.querySelectorAll(".thumb").forEach(function (b, i) { b.setAttribute("aria-current", String(i === cur)); });
  }

  function renderThumbs() {
    var box = $("thumbs");
    box.innerHTML = "";
    SKINS.forEach(function (s, i) {
      var b = document.createElement("button");
      b.className = "thumb"; b.type = "button"; b.setAttribute("role", "listitem");
      b.setAttribute("aria-label", s.name[lang]);
      var im = document.createElement("img"); im.src = s.img; im.alt = ""; im.loading = "lazy";
      b.appendChild(im);
      b.addEventListener("click", function () { go(i); });
      box.appendChild(b);
    });
    var multi = SKINS.length > 1;
    $("prevBtn").hidden = !multi; $("nextBtn").hidden = !multi;
    box.hidden = !multi;
  }

  function go(i) {
    if (!SKINS.length) return;
    cur = (i + SKINS.length) % SKINS.length;
    renderSkin(true);
  }

  $("prevBtn").addEventListener("click", function () { go(cur - 1); });
  $("nextBtn").addEventListener("click", function () { go(cur + 1); });
  document.addEventListener("keydown", function (e) {
    var tag = (document.activeElement && document.activeElement.tagName) || "";
    if (tag === "INPUT" || tag === "TEXTAREA") return;
    if (e.key === "ArrowLeft") go(cur - 1);
    if (e.key === "ArrowRight") go(cur + 1);
  });

  // swipe
  var sx = null;
  var stage = $("stage");
  stage.addEventListener("pointerdown", function (e) { sx = e.clientX; });
  stage.addEventListener("pointerup", function (e) {
    if (sx === null) return;
    var dx = e.clientX - sx; sx = null;
    if (Math.abs(dx) > 50) go(cur + (dx < 0 ? 1 : -1));
  });
  stage.addEventListener("pointercancel", function () { sx = null; });

  document.querySelectorAll(".lang button").forEach(function (b) {
    b.addEventListener("click", function () {
      lang = b.dataset.lang;
      try { localStorage.setItem("esirak-lang", lang); } catch (e) {}
      applyStatic(); renderThumbs(); renderSkin(false);
    });
  });

  applyStatic(); renderThumbs(); renderSkin(false);
})();
</script>
</body>
</html>
